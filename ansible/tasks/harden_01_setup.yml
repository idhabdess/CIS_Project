---
- name: "Remédier 1.3 à 1.14 - Sécuriser les permissions des fichiers critiques"
  file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
    owner: root
    group: "{{ item.group }}"
  loop:
    - { path: '/etc/passwd', mode: '0644', group: 'root' }
    - { path: '/etc/shadow', mode: '0600', group: 'shadow' }
    - { path: '/etc/gshadow', mode: '0640', group: 'shadow' }
    - { path: '/boot/grub/grub.cfg', mode: '0600', group: 'root' }
  ignore_errors: yes

- name: "Remédier 1.16 - Désactiver core dumps"
  sysctl: name=fs.suid_dumpable value='0' state=present sysctl_set=yes

- name: "Remédier 1.17 - Activer AppArmor"
  service: name=apparmor state=started enabled=yes
  ignore_errors: yes

- name: "Remédier 1.18 & 1.19 - Créer et sécuriser le fichier /etc/motd"
  copy:
    dest: /etc/motd
    content: "ATTENTION : Acces restreint aux utilisateurs autorises uniquement.\n"
    mode: '0644'
    owner: root
    group: root
