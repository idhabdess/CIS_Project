---
- name: "CIS 1.3 - Permissions /etc/passwd"
  stat: path=/etc/passwd
  register: stat_passwd
- name: "CIS 1.4 - Permissions /etc/shadow"
  stat: path=/etc/shadow
  register: stat_shadow
- name: "CIS 1.11 - Permissions /etc/gshadow"
  stat: path=/etc/gshadow
  register: stat_gshadow
- name: "CIS 1.14 - Permissions /boot/grub/grub.cfg"
  stat: path=/boot/grub/grub.cfg
  register: stat_grub
- name: "CIS 1.10 - Fichier /etc/issue non vide"
  stat: path=/etc/issue
  register: stat_issue
- name: "CIS 1.16 - Restriction core dumps (suid_dumpable)"
  command: sysctl fs.suid_dumpable
  register: check_suid_dumpable
  changed_when: false
- name: "CIS 1.17 - Vérifier l'activation d'AppArmor"
  command: apparmor_status
  register: check_apparmor
  ignore_errors: yes
  changed_when: false
- name: "CIS 1.18 - Présence de /etc/motd"
  stat: path=/etc/motd
  register: stat_motd
- name: "CIS 1.19 - Permissions /etc/motd"
  stat: path=/etc/motd
  register: stat_motd_perms
- name: "CIS 1.20 - Permissions /etc/issue.net"
  stat: path=/etc/issue.net
  register: stat_issue_net
