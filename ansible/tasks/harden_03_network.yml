---
- name: "Remédier 3.1 - Activer le pare-feu UFW"
  ufw: state=enabled policy=deny

- name: "Remédier 3.2 à 3.10 - Durcir les paramètres noyau (Sysctl)"
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.val }}"
    state: present
    sysctl_set: yes
    reload: yes
  loop:
    - { name: 'net.ipv4.ip_forward', val: '0' }
    - { name: 'net.ipv4.conf.all.accept_redirects', val: '0' }
    - { name: 'net.ipv4.conf.all.accept_source_route', val: '0' }
    - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', val: '1' }
    - { name: 'net.ipv4.conf.all.rp_filter', val: '1' }
    - { name: 'net.ipv4.tcp_syncookies', val: '1' }
    - { name: 'net.ipv4.conf.all.secure_redirects', val: '0' }
    - { name: 'net.ipv6.conf.all.disable_ipv6', val: '1' }
  ignore_errors: yes
