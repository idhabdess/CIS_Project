<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent de Hardening CIS - Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div class="max-w-6xl mx-auto p-6 md:p-10">
        
        <!-- En-tête de l'application -->
        <header class="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <div class="flex items-center gap-2">
                    <span class="h-3 w-3 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Agent Local Actif</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 mt-1">Plateforme de Hardening CIS</h1>
                <p class="text-slate-500 text-sm">Autodiagnostic et remédiation automatisée du système hôte</p>
            </div>
            
            <!-- Actions principales -->
            <div class="flex flex-wrap items-center gap-3">
                <button id="btn-audit" onclick="lancerAudit()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2.5 px-4 rounded-xl shadow-sm transition flex items-center gap-2">
                    🔍 <span>Lancer l'Audit</span>
                </button>
                <button id="btn-harden" onclick="lancerAction('/api/v1/harden/global', 'Durcissement du système en cours...')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm py-2.5 px-4 rounded-xl shadow-sm transition flex items-center gap-2">
                    🛡️ <span>Durcir</span>
                </button>
                <button id="btn-rollback" onclick="lancerAction('/api/v1/rollback/global', 'Restauration en cours...')" class="bg-amber-600 hover:bg-amber-700 text-white font-medium text-sm py-2.5 px-4 rounded-xl shadow-sm transition flex items-center gap-2">
                    ↩️ <span>Rollback</span>
                </button>
                <button id="btn-auto" onclick="toggleAutoMode()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium text-sm py-2.5 px-4 rounded-xl transition">
                    🤖 Mode Auto: OFF
                </button>
            </div>
        </header>

        <!-- Indicateur de chargement -->
        <div id="loading" class="hidden bg-white border border-slate-200 rounded-2xl shadow-sm p-12 text-center my-8">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-3 border-blue-600 border-t-transparent mb-4"></div>
            <p id="loading-text" class="text-slate-600 font-medium">Analyse du système en cours...</p>
        </div>

        <!-- Rapport de Conformité -->
        <div id="resultats-container" class="hidden bg-white border border-slate-200 rounded-2xl shadow-sm p-6 md:p-8">
            
            <!-- Barre de résumé -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 mb-6 border-b border-slate-100 gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Rapport de Conformité CIS</h2>
                    <p class="text-slate-500 text-sm">Évaluation complète des règles de sécurité de l'agent</p>
                </div>
                
                <div class="flex items-center gap-6 bg-slate-50 border border-slate-100 px-5 py-3 rounded-xl">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Score Global</p>
                        <span id="score-text" class="text-2xl font-black text-blue-600">--/--</span>
                    </div>
                    <div class="border-l border-slate-200 pl-6">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Conformité</p>
                        <span id="taux-text" class="text-2xl font-black text-slate-700">--%</span>
                    </div>
                </div>
            </div>

            <!-- Liste des contrôles (Design épuré) -->
            <ul id="liste-controles" class="space-y-2.5 max-h-[600px] overflow-y-auto pr-2">
                <!-- Injection dynamique des résultats -->
            </ul>
        </div>
    </div>

    <!-- Script de gestion de l'interface -->
    <script>
        document.addEventListener('DOMContentLoaded', lancerAudit);

        async function lancerAudit() {
            setLoading(true, "Analyse des 50 règles de sécurité en cours...");
            try {
                const reponse = await fetch(`/api/v1/audit/global?machine=localhost`, {
                    method: 'POST',
                    headers: { 'X-API-Key': 'cis_secret_key_2026' }
                });
                if (!reponse.ok) throw new Error(`Erreur HTTP: ${reponse.status}`);
                const data = await reponse.json();
                afficherResultats(data);
            } catch (erreur) {
                alert("Erreur de communication avec l'API : " + erreur.message);
            } finally {
                setLoading(false);
            }
        }

        function afficherResultats(data) {
            document.getElementById('resultats-container').classList.remove('hidden');
            document.getElementById('score-text').innerText = data.score;
            document.getElementById('taux-text').innerText = data.taux_conformite;
            
            const liste = document.getElementById('liste-controles');
            liste.innerHTML = ''; 

            data.resultats.forEach(item => {
                const estConforme = item.statut === "CONFORME";
                const rowBg = estConforme ? 'bg-emerald-50/50 border-emerald-100 text-emerald-900' : 'bg-rose-50/50 border-rose-100 text-rose-900';
                const badgeBg = estConforme ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800';
                const icone = estConforme ? '✓' : '✕';

                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-3.5 border rounded-xl text-sm transition ${rowBg}`;
                li.innerHTML = `
                    <span class="font-medium text-slate-700">${item.controle}</span>
                    <span class="px-3 py-1 rounded-lg text-xs font-bold tracking-wide flex items-center gap-1.5 ${badgeBg}">
                        <span>${icone}</span>
                        <span>${item.statut}</span>
                    </span>
                `;
                liste.appendChild(li);
            });
        }

        async function lancerAction(url, messageChargement) {
            setLoading(true, messageChargement);
            try {
                const reponse = await fetch(`${url}?machine=localhost`, {
                    method: 'POST',
                    headers: { 'X-API-Key': 'cis_secret_key_2026' }
                });
                if (!reponse.ok) throw new Error(`Erreur HTTP: ${reponse.status}`);
                const data = await reponse.json();
                await lancerAudit(); 
                alert(data.message);
            } catch (erreur) {
                alert("Erreur lors de l'exécution : " + erreur.message);
                setLoading(false);
            }
        }

        function setLoading(enCours, message = "") {
            const loadingDiv = document.getElementById('loading');
            const resultatsContainer = document.getElementById('resultats-container');
            const btnAudit = document.getElementById('btn-audit');

            if (enCours) {
                document.getElementById('loading-text').innerText = message;
                loadingDiv.classList.remove('hidden');
                resultatsContainer.classList.add('hidden');
                btnAudit.disabled = true;
                btnAudit.classList.add('opacity-50');
            } else {
                loadingDiv.classList.add('hidden');
                btnAudit.disabled = false;
                btnAudit.classList.remove('opacity-50');
            }
        }

        let autoModeActif = false;
        async function toggleAutoMode() {
            autoModeActif = !autoModeActif;
            try {
                const reponse = await fetch(`/api/v1/auto/toggle?activer=${autoModeActif}`, {
                    method: 'POST',
                    headers: { 'X-API-Key': 'cis_secret_key_2026' }
                });
                if (!reponse.ok) throw new Error("Erreur de modification du mode");
                const data = await reponse.json();
                const btn = document.getElementById('btn-auto');

                if (data.etat) {
                    btn.innerText = "🤖 Mode Auto: ON";
                    btn.className = "bg-purple-600 text-white font-medium text-sm py-2.5 px-4 rounded-xl shadow-sm transition animate-pulse";
                    alert("Mode automatique activé : surveillance et correction en arrière-plan.");
                } else {
                    btn.innerText = "🤖 Mode Auto: OFF";
                    btn.className = "bg-slate-200 text-slate-700 font-medium text-sm py-2.5 px-4 rounded-xl transition";
                    alert("Mode automatique désactivé.");
                }
            } catch (erreur) {
                alert("Erreur : " + erreur.message);
                autoModeActif = !autoModeActif; 
            }
        }
    </script>
</body>
</html>
